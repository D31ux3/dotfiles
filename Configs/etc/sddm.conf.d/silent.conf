# Login screen theme: SilentSDDM (https://github.com/uiriansan/SilentSDDM), AUR sddm-silent-theme.
# The preset is chosen with ConfigFile= in /usr/share/sddm/themes/silent/metadata.desktop.
# Test it without logging out: cd /usr/share/sddm/themes/silent && ./test.sh
[General]
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/silent/components/,QT_IM_MODULE=qtvirtualkeyboard

[Theme]
Current=silent
