# Xorg is only used by the SDDM login screen (Hyprland runs on Wayland).
# Use only the primary GPU (the one that drove the boot screen) and don't add
# other GPUs as secondary ones. On hybrid machines (iGPU + NVIDIA) adding the
# NVIDIA card as secondary can fail ("modeset(G0): Failed to create pixmap")
# and leave Xorg not answering clients: black screen with a cursor, no greeter.
# With a single GPU it has no effect.
Section "ServerFlags"
    Option "AutoAddGPU" "off"
EndSection
