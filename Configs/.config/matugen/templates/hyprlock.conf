# Generated by matugen from the wallpaper (template: ~/.config/matugen/templates/hyprlock.conf)
# The wallpaper these colors come from, used as the lock screen background
$wallpaper = {{image}}

$text    = rgb({{colors.on_surface.default.hex_stripped}})
$accent  = rgb({{colors.primary.default.hex_stripped}})
$surface = rgba({{colors.surface_container.default.hex_stripped}}cc)
$error   = rgb({{colors.error.default.hex_stripped}})
$check   = rgb({{colors.tertiary.default.hex_stripped}})
