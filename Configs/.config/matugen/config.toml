# matugen: colors from the wallpaper (Material You). Run by ~/.config/hypr/scripts/set-wallpaper.sh
# (mainMod + W) and, when the colors are missing, by wallpaper.sh at startup.
# Each template is filled with the colors and written where the app reads it; post_hook reloads the app.
# The written files are not versioned (.gitignore). Color names: matugen image <img> --dry-run -j hex
# Options (scheme, which color of the image) are in set-wallpaper.sh and install.sh
[config]

# Terminal colors (kitty): Tokyo Night's hues, blended toward the wallpaper's colors.
# Each one gives {{colors.<name>.default.hex}} plus on_<name>, <name>_container and on_<name>_container
[config.custom_colors]
red     = { color = "#f7768e", blend = true }
green   = { color = "#9ece6a", blend = true }
yellow  = { color = "#e0af68", blend = true }
blue    = { color = "#7aa2f7", blend = true }
magenta = { color = "#bb9af7", blend = true }
cyan    = { color = "#7dcfff", blend = true }

[templates.waybar]
input_path  = '~/.config/matugen/templates/waybar.css'
output_path = '~/.config/waybar/colors/colors.css'
post_hook   = 'pkill -SIGUSR2 -x waybar || true'

[templates.swaync]
input_path  = '~/.config/matugen/templates/swaync.css'
output_path = '~/.config/swaync/colors.css'
post_hook   = 'swaync-client -rs >/dev/null 2>&1 || true'

[templates.wlogout]
input_path  = '~/.config/matugen/templates/wlogout.css'
output_path = '~/.config/wlogout/colors.css'

[templates.swayosd]
input_path  = '~/.config/matugen/templates/swayosd.css'
output_path = '~/.config/swayosd/colors.css'
# swayosd reads its CSS when it starts: restart it to apply the new colors
post_hook   = 'pkill -x swayosd-server; (setsid swayosd-server >/dev/null 2>&1 &) || true'

# GTK apps (pavucontrol, nautilus, nm-connection-editor, file dialogs...): gtk-3.0/gtk.css and
# gtk-4.0/gtk.css import these. GTK 3 apps that are open reload them when the theme is set again;
# GTK 4 apps only read them when they start
[templates.gtk3]
input_path  = '~/.config/matugen/templates/gtk3-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook   = "gsettings set org.gnome.desktop.interface gtk-theme '' && gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark' || true"

[templates.gtk4]
input_path  = '~/.config/matugen/templates/gtk4-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

# KDE apps (Dolphin...): kdeglobals selects this scheme ([UiSettings] ColorScheme=Matugen).
# They load it when they start: open ones keep their colors until restarted
[templates.kde]
input_path  = '~/.config/matugen/templates/kde-colors.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'

# Other Qt apps: qt6ct.conf points color_scheme_path here
[templates.qt6ct]
input_path  = '~/.config/matugen/templates/qt6ct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.rofi]
input_path  = '~/.config/matugen/templates/rofi.rasi'
output_path = '~/.config/rofi/colors/matugen.rasi'

[templates.hyprland]
input_path  = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.config/hypr/conf/colors.lua'
post_hook   = 'hyprctl reload >/dev/null 2>&1 || true'

[templates.hyprlock]
input_path  = '~/.config/matugen/templates/hyprlock.conf'
output_path = '~/.config/hypr/hyprlock-colors.conf'

[templates.kitty]
input_path  = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/themes/matugen.conf'
post_hook   = 'pkill -SIGUSR1 -x kitty || true'
