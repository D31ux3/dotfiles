# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# hyprlock still uses the classic hyprlang format, not Lua

# $wallpaper and $text, $accent, $surface, $error, $check: the current wallpaper and its colors (written by matugen)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    path = $wallpaper   # the current wallpaper (hyprlock-colors.conf)
    blur_passes = 3
}

input-field {
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    placeholder_text = Password
    outer_color = $accent
    inner_color = $surface
    font_color  = $text
    check_color = $check
    fail_color  = $error
}

# Profile picture: ~/.face, set by Scripts/avatar.sh from Assets/Pictures/pfp
image {
    path = ~/.face
    size = 140
    rounding = -1
    border_size = 0
    position = 0, 80
    halign = center
    valign = center
}

label {
    text = $TIME
    font_size = 64
    color = $text
    position = 0, 260
    halign = center
    valign = center
}
