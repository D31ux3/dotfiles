# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# hyprlock still uses the classic hyprlang format, not Lua

general {
    hide_cursor = true
}

background {
    path = ~/Pictures/Wallpapers/Lucy-rain.png
    blur_passes = 3
}

input-field {
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    placeholder_text = Password
}

# Profile picture: ~/.face, set by Scripts/avatar.sh from Assets/Pictures/pfp
image {
    path = ~/.face
    size = 140
    rounding = -1
    border_size = 0
    position = 0, 80
    halign = center
    valign = center
}

label {
    text = $TIME
    font_size = 64
    position = 0, 260
    halign = center
    valign = center
}
