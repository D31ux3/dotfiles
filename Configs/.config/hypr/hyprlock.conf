# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# hyprlock still uses the classic hyprlang format, not Lua

# $wallpaper and $text, $accent, $surface, $error, $check: the current wallpaper and its colors (written by matugen)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    path = $wallpaper   # the current wallpaper (hyprlock-colors.conf)
    blur_passes = 3
}

input-field {
    size = 300, 50
    position = 0, -180
    halign = center
    valign = center
    placeholder_text = Password
    outer_color = $accent
    inner_color = $surface
    font_color  = $text
    check_color = $check
    fail_color  = $error
}

# Profile picture: ~/.face, set by Scripts/avatar.sh from Assets/Pictures/pfp
image {
    path = ~/.face
    size = 160
    rounding = -1
    border_size = 0
    position = 0, -45
    halign = center
    valign = center
}

label {
    text = $TIME
    font_size = 96
    color = $text
    position = 0, 185
    halign = center
    valign = center
}

# Date under the time: "Sunday, November 15, 2026" (LC_TIME=C keeps the names in English)
# Layout, top to bottom: time and date close together (they read as one block), more space
# before the picture, then the password field; the whole group sits just above the middle
label {
    text = cmd[update:60000] LC_TIME=C date +"%A, %B %-d, %Y"
    font_size = 24
    color = $text
    position = 0, 100
    halign = center
    valign = center
}
