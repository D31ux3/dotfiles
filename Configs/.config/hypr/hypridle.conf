general {
    lock_cmd = pidof hyprlock || hyprlock     # avoid starting a second hyprlock
    before_sleep_cmd = loginctl lock-session  # lock before suspend, so resume asks for the password
}

listener {
    timeout = 300 # 5 minutes
    on-timeout = brightnessctl -s && brightnessctl s 1%
    on-resume = brightnessctl -r
    condition_cmd = ~/.config/hypr/scripts/is-using-battery.sh
}

listener {
    timeout = 600 # 10 minutes
    on-timeout = systemctl suspend
    condition_cmd = ~/.config/hypr/scripts/is-using-battery.sh
}